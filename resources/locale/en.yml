ernestdefoe-gameday:
  admin:
    settings:
      title: Game Day
      enabled_label: Post game threads
      enabled_help: >-
        Nothing is posted until this is on. Turning it off leaves every thread
        already opened exactly where it is.
      author_label: Post threads as
      author_help: >-
        The member ID the threads and recaps are posted as. There is no default:
        posting as whoever happens to be user 1 puts a founder's name on a
        hundred threads they did not write.
      lead_label: Open a thread this many minutes before kickoff
      lead_help: Three hours by default.
      fallback_tag_label: Tag to use when neither team has one
      fallback_tag_help: >-
        Used when neither team in a game has been mapped to a tag below. Leave
        it empty to post those threads untagged. A neutral-site game does not
        need it: those still have a designated home team, and its tag is used
        like any other.
      sport_options:
        gridiron: American football
        soccer: Football (soccer)
        hardwood: Basketball
        diamond: Baseball
        ice: Ice hockey
      sport_label: Sport
      sport_help: >-
        Which sport's words a recap is written in. A football recap talks about
        yards, turnovers and a quarterback's line; a soccer one talks about
        shots, possession and a draw. The fixtures themselves are Picks'
        business — this only decides how the game is described.
      timezone_label: Time zone for kickoff times
      timezone_help: >-
        The opening post says when the game starts, and a post is never
        rewritten — so it is printed in this zone, with the abbreviation beside
        it. Flarum stores every date in UTC and has no board-wide zone of its
        own, which is why this is asked for here. Eastern by default, because
        that is the zone this sport's schedules are published in.
      timezone_here: (this server)
      recaps_label: Post a recap when the game finishes
      recaps_help: >-
        The score first, filled out with the box score when it arrives — the
        provider publishes statistics minutes to hours after the final whistle,
        so the post is rewritten in place rather than made to wait.
      sticky_label: Stick the thread to the top while the game is on
      sticky_help: >-
        Flarum has no "live" state for a discussion, and this does not pretend
        otherwise — sticky is the nearest honest equivalent, and it comes off
        again when the game ends. Needs the Sticky extension.
      sticky_missing: The Sticky extension is not enabled, so this does nothing.
      tags_missing: The Tags extension is not enabled, so game threads are posted untagged.
      watch_enabled_label: Show where to watch on the scoreboard
      watch_enabled_help: >-
        The channels a game is on, from the listings in the score feed, with a
        Watch button that opens the network's own player in a new tab. Nothing
        is streamed or embedded here — live rights do not allow it. Turn it off to hide
        channels everywhere, including the opening post: the listings are
        ESPN's, which are US channels only, so a forum outside the US may not
        want them.
      watch_leagues_label: Leagues that show where to watch
      watch_leagues_help: >-
        Tick none to show it for every league, including ones added later.
      watch_leagues_none: Picks has no leagues to list yet.
      highlights_label: Show highlight clips on finished games
      highlights_help: >-
        Up to six clips from ESPN under the scoreboard of a finished game's
        thread, collected for a day after the final as they are published. Each
        plays in ESPN's own player, which loads only when somebody presses play.
        The recap post itself is never changed for them.
    tags:
      title: Which tag each team's games go in
      description: >-
        The home team's tag is used first, then the away team's, then the
        fallback above. A board with one football tag can map everybody to it.
      team: Team
      conference: Conference
      tag: Tag
      none: No tag of its own
      save: Save mapping
      saved: Mapping saved.
      loading: Loading teams…
      empty: No teams yet — sync them in Picks first.
  forum:
    board_scheduled: Kickoff
    board_stale: Waiting for the feed
    board_time_tba: time TBA
    board_red_zone: Red zone
    board_possession: "{team} have the ball"
    # The rank a team carried INTO this game, which is why it never moves again.
    board_rank: "Ranked #{rank}"

    # Where to watch — inside the scoreboard card. Network names are not translated.
    watch_caption: Where to watch
    watch_caption_final: Shown on
    watch_kind_tv: TV
    watch_kind_streaming: Streaming
    watch_kind_radio: Radio
    watch_local: "{team} area"
    watch_subscription: Subscription
    watch_button: "Watch on {network}"
    watch_button_label: "Watch on {network} (opens in a new tab)"

    # Highlight clips under a finished game's scoreboard.
    highlights_title: Highlights
    highlights_play: "Play: {title}"

    # The scoreboard as a widget — see ScoreboardWidget.
    widget_scoreboard: Scoreboard
    widget_live: Live
    widget_scheduled: Kickoff
    widget_stale: Waiting for the feed
    widget_time_tba: time TBA
    widget_red_zone: Red zone
    widget_rank: "Ranked #{rank}"
    widget_to_the_thread: Go to the game thread
    widget_no_game: No game on right now.
    widget_field_title: Title
    widget_field_link: Link to the game thread
    widget_field_hide: Hide when there is no game
    widget_field_scroll: Advance through the games on its own
    widget_default_title: Game Day
    performers_empty: No box scores yet this week.

