      on_tv: "On {broadcast}."
      both_unbeaten: "Both come in unbeaten — {away} {awayRecord}, {home} {homeRecord}."
      records: "{away} are {awayRecord}, {home} {homeRecord}."
      two_ranked: Two ranked sides.
      # {article} is "a" or "an", picked for the English conference name.
      conference_game: "It is {article, select, an {an} other {a}} {conference} game."
      pick: "Pick this game before kickoff: {url}"
      # Also how a rerun recognises an opener it already wrote.
      signature: Thread is open — predictions, complaints and everything in between.
